<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 600" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <filter id="sh" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>

  <!-- panel -->
  <rect x="20" y="20" width="1120" height="560" rx="18" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>

  <!-- title -->
  <text x="44" y="60" font-size="26" font-weight="700" fill="#0f172a">Clinical Recovery Analytics Platform</text>
  <text x="44" y="86" font-size="15" fill="#475569">FHIR R4  →  PostgreSQL  →  SQL · Power BI · Machine Learning   ·   Atlas Rehabilitation Network</text>

  <!-- ============ COL 1 : SOURCE (FHIR) ============ -->
  <rect x="44" y="116" width="250" height="300" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" filter="url(#sh)"/>
  <text x="169" y="142" font-size="15" font-weight="700" fill="#1d4ed8" text-anchor="middle">EHR sources</text>
  <text x="169" y="160" font-size="11" fill="#64748b" text-anchor="middle">HL7 v2 (ADT·SIU·ORU) → FHIR R4</text>
  <g font-size="12" fill="#1e3a8a">
    <rect x="64" y="172" width="210" height="28" rx="6" fill="#dbeafe"/><text x="169" y="191" text-anchor="middle">Patient</text>
    <rect x="64" y="205" width="210" height="28" rx="6" fill="#dbeafe"/><text x="169" y="224" text-anchor="middle">Practitioner</text>
    <rect x="64" y="238" width="210" height="28" rx="6" fill="#dbeafe"/><text x="169" y="257" text-anchor="middle">Appointment</text>
    <rect x="64" y="271" width="210" height="28" rx="6" fill="#dbeafe"/><text x="169" y="290" text-anchor="middle">Encounter</text>
    <rect x="64" y="304" width="210" height="28" rx="6" fill="#dbeafe"/><text x="169" y="323" text-anchor="middle">Condition</text>
    <rect x="64" y="337" width="210" height="28" rx="6" fill="#dbeafe"/><text x="169" y="356" text-anchor="middle">Observation (PROMs)</text>
    <rect x="64" y="370" width="210" height="28" rx="6" fill="#dbeafe"/><text x="169" y="389" text-anchor="middle">CarePlan</text>
  </g>

  <!-- ============ COL 2 : TRANSFORM ============ -->
  <rect x="332" y="196" width="168" height="140" rx="12" fill="#f0f9ff" stroke="#0ea5e9" stroke-width="1.5" filter="url(#sh)"/>
  <text x="416" y="224" font-size="14" font-weight="700" fill="#0369a1" text-anchor="middle">Extract &amp;</text>
  <text x="416" y="242" font-size="14" font-weight="700" fill="#0369a1" text-anchor="middle">Transform</text>
  <g font-size="11.5" fill="#475569" text-anchor="middle">
    <text x="416" y="268">flatten JSON</text>
    <text x="416" y="288">resolve references</text>
    <text x="416" y="308">map LOINC /</text>
    <text x="416" y="324">SNOMED / ICD-10</text>
  </g>

  <!-- ============ COL 3 : POSTGRESQL ============ -->
  <rect x="538" y="116" width="262" height="300" rx="12" fill="#f8fafc" stroke="#0f766e" stroke-width="1.5" filter="url(#sh)"/>
  <text x="669" y="142" font-size="15" font-weight="700" fill="#0f766e" text-anchor="middle">PostgreSQL</text>

  <rect x="560" y="158" width="218" height="104" rx="9" fill="#ffffff" stroke="#5eead4" stroke-width="1.5"/>
  <text x="669" y="180" font-size="13" font-weight="700" fill="#134e4a" text-anchor="middle">Core schema (silver)</text>
  <text x="669" y="200" font-size="11.5" fill="#475569" text-anchor="middle">8 normalized tables,</text>
  <text x="669" y="216" font-size="11.5" fill="#475569" text-anchor="middle">1 per FHIR resource</text>
  <text x="669" y="240" font-size="11.5" fill="#475569" text-anchor="middle">PK / FK integrity, indexes</text>

  <rect x="560" y="276" width="218" height="124" rx="9" fill="#ffffff" stroke="#5eead4" stroke-width="1.5"/>
  <text x="669" y="298" font-size="13" font-weight="700" fill="#134e4a" text-anchor="middle">Star schema (gold)</text>
  <text x="669" y="318" font-size="11.5" fill="#475569" text-anchor="middle">dim_date · dim_patient ·</text>
  <text x="669" y="334" font-size="11.5" fill="#475569" text-anchor="middle">dim_clinic · dim_diagnosis</text>
  <text x="669" y="354" font-size="11.5" fill="#475569" text-anchor="middle">fact_appointment · fact_outcome</text>
  <text x="669" y="378" font-size="11.5" fill="#475569" text-anchor="middle">+ KPI views</text>

  <!-- ============ COL 4 : CONSUMERS ============ -->
  <rect x="838" y="120" width="278" height="96" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5" filter="url(#sh)"/>
  <text x="977" y="146" font-size="14" font-weight="700" fill="#b45309" text-anchor="middle">Power BI dashboards</text>
  <text x="977" y="168" font-size="11.5" fill="#78716c" text-anchor="middle">Executive · Clinical · Operational</text>
  <text x="977" y="188" font-size="11.5" fill="#78716c" text-anchor="middle">DAX measure library</text>
  <text x="977" y="206" font-size="11.5" fill="#78716c" text-anchor="middle">drop-out risk register</text>

  <rect x="838" y="228" width="278" height="74" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" filter="url(#sh)"/>
  <text x="977" y="254" font-size="14" font-weight="700" fill="#1d4ed8" text-anchor="middle">SQL analytics</text>
  <text x="977" y="276" font-size="11.5" fill="#64748b" text-anchor="middle">10 business queries · CTEs ·</text>
  <text x="977" y="292" font-size="11.5" fill="#64748b" text-anchor="middle">window functions · MCID KPIs</text>

  <rect x="838" y="314" width="278" height="96" rx="12" fill="#faf5ff" stroke="#7c3aed" stroke-width="1.5" filter="url(#sh)"/>
  <text x="977" y="340" font-size="14" font-weight="700" fill="#6d28d9" text-anchor="middle">Predictive models (ML)</text>
  <text x="977" y="362" font-size="11.5" fill="#7c6f86" text-anchor="middle">no-show · early drop-out</text>
  <text x="977" y="380" font-size="11.5" fill="#7c6f86" text-anchor="middle">scikit-learn · leakage-safe ·</text>
  <text x="977" y="398" font-size="11.5" fill="#7c6f86" text-anchor="middle">AUROC / AUPRC / calibration</text>

  <!-- arrows -->
  <g stroke="#475569" stroke-width="2" fill="none">
    <line x1="296" y1="266" x2="330" y2="266" marker-end="url(#arr)"/>
    <line x1="502" y1="266" x2="536" y2="266" marker-end="url(#arr)"/>
    <path d="M802,210 C824,210 818,168 836,168" marker-end="url(#arr)"/>
    <line x1="802" y1="266" x2="836" y2="265" marker-end="url(#arr)"/>
    <path d="M802,322 C824,322 818,362 836,362" marker-end="url(#arr)"/>
  </g>

  <!-- governance band -->
  <rect x="44" y="494" width="1072" height="64" rx="10" fill="#ecfeff" stroke="#0891b2" stroke-width="1.5"/>
  <text x="64" y="520" font-size="13" font-weight="700" fill="#155e75">Governance</text>
  <text x="64" y="540" font-size="12" fill="#475569">GDPR (Art. 9 health data) · pseudonymisation (MRN only) · row-level security by clinic · EU AI Act (human-in-the-loop, DPIA, calibration &amp; bias monitoring)</text>

  <text x="1116" y="586" font-size="10" fill="#94a3b8" text-anchor="end">Synthetic data · reproducible (seed 42)</text>
</svg>
